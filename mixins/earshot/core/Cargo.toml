[package]
name = "earshot-core"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT AND BSD-3-Clause"   # our code MIT; src/opus/ is opus-rs (BSD-3-Clause, see COPYING-opus-rs)
description = "Earshot's game-independent core: SVC-compatible wire format, encryption, Opus, jitter buffer, spatial audio"
publish = false

# Horizon only allows crates already in its Cargo.lock, in matching versions (aes 0.8.4, getrandom 0.3.4).
# No dev-dependencies either: they would have to be in Horizon's lock too.
[dependencies]
aes = "0.8"        # MIT OR Apache-2.0: the AES block cipher; GCM is built on it in src/crypto.rs
cpal = { version = "0.16", optional = true }  # Apache-2.0: microphone and speakers
getrandom = "0.3"  # MIT OR Apache-2.0: random nonces
serde_json = "1"   # MIT OR Apache-2.0: reading chat lines' JSON (src/chat.rs); Horizon's lock has 1.0.151

[features]
default = ["std", "heap", "audio"]
# Sound card access (the client). A dedicated server build would leave it out.
audio = ["dep:cpal"]
# Features of the vendored opus-rs (src/opus): `std` + `heap` are its defaults.
std = []
heap = ["std"]
