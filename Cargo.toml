[package]
name = "mod-earshot"
version = "2.0.8"
edition = "2024"
license = "MIT AND BSD-3-Clause"
publish = false
description = "Earshot for Horizon: proximity voice chat compatible with Simple Voice Chat. Not affiliated with Simple Voice Chat."

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build).
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
# Earshot's game-independent core: wire format, encryption, Opus, audio, the voice server.
# Its registry dependencies are pinned in Cargo.lock (`horizon-launcher native-lock .`).
earshot-core = { path = "src/core" }
serde_json = "1"
